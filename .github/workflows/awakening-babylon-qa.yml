name: Babylon asset QA validation
on:
  push:
    branches:
      - rebuild/arcturian-awakening-20261113
    paths:
      - 'awakening-rebuild/engine-lab/**'
      - '.github/workflows/awakening-babylon-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: awakening-rebuild/engine-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - run: npm run build
