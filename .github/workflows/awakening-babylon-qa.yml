name: Babylon asset lab real browser integration

on:
  push:
    branches: ['rebuild/arcturian-awakening-20261113']
    paths:
      - 'awakening-rebuild/engine-lab/**'
      - '.github/workflows/awakening-babylon-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: awakening-rebuild/engine-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Typecheck, review-gate tests and build
        run: npm run check
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Fetch and fingerprint the licensed rig diagnostic asset
        run: |
          mkdir -p test-fixtures artifacts
          curl --fail --location --retry 3 --silent --show-error "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CesiumMan/glTF-Binary/CesiumMan.glb" -o test-fixtures/CesiumMan.glb
          python3 - <<'PY'
          import hashlib, pathlib
          data=pathlib.Path("test-fixtures/CesiumMan.glb").read_bytes()
          git_hash=hashlib.sha1(b"blob "+str(len(data)).encode()+b"\x00"+data).hexdigest()
          expected="8586c4e6a59bf8ef585c2a685c50a80d28503216"
          assert git_hash==expected, f"Sample model changed or download corrupted: {git_hash}"
          print(f"Rigged model fixture checked: {len(data)} bytes, Git SHA {git_hash}")
          PY
      - name: Browser GLB loader / animation and mobile inspection
        run: npm run test:browser
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcturian-3d-qa-browser-captures
          path: |
            awakening-rebuild/engine-lab/artifacts
            awakening-rebuild/engine-lab/test-results
          retention-days: 14
