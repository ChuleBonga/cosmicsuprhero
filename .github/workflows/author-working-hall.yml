name: Author Arrival Quarter civic hall study
on:
  push:
    branches: [rebuild/arcturian-awakening-20261113]
    paths:
      - 'awakening-rebuild/engine-lab/tools/build-hall-study.py'
      - '.github/workflows/author-working-hall.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  model-and-verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: awakening-rebuild/engine-lab
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned original-geometry toolchain
        run: python -m pip install --disable-pip-version-check trimesh==4.11.1 numpy==2.3.5
      - name: Generate and check reproducibility
        run: |
          python tools/build-hall-study.py
          first=$(sha256sum public/models/ENV-003-working-listening-hall-blockout-v01.glb | cut -d' ' -f1)
          python tools/build-hall-study.py
          second=$(sha256sum public/models/ENV-003-working-listening-hall-blockout-v01.glb | cut -d' ' -f1)
          test "$first" = "$second" || { echo "Model generator not deterministic"; exit 1; }
          echo "Canonical hall study: $first"
      - name: Commit only the model and technical report to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/ENV-003-working-listening-hall-blockout-v01.glb
          git add public/models/ENV-003-hall-blockout-report.json
          if git diff --cached --quiet; then
            echo "Nothing to update"
            exit 0
          fi
          git commit -m "art(blockout): commit reproducible 85-piece civic hall for model review"
          git push origin HEAD:refs/heads/rebuild/arcturian-awakening-20261113
