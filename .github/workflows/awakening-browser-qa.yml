name: Arcturian actual browser gameplay QA
on:
  push:
    branches:
      - rebuild/arcturian-awakening-20261113
    paths:
      - 'awakening-rebuild/**'
      - '.github/workflows/awakening-browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-journeys:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: awakening-rebuild
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npx playwright install chromium --with-deps
      - run: mkdir -p artifacts && npm run test:browser
      - name: Preserve screenshots, report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcturian-browser-qa
          path: |
            awakening-rebuild/artifacts
            awakening-rebuild/test-results
          retention-days: 14