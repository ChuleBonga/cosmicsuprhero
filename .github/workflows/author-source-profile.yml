name: Artist-source Arcturian profile reference

on:
  push:
    branches: [rebuild/arcturian-awakening-20261113]
    paths:
      - 'awakening-rebuild/production/tools/extract-source-figure.py'
      - '.github/workflows/author-source-profile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-profile:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: awakening-rebuild
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image processing dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 pillow==12.3.0 opencv-python-headless==4.13.0.92
      - name: Generate source-faithful profile-only reference
        run: python production/tools/extract-source-figure.py
      - name: Publish reference artifacts to isolated development branch
        run: |
          if git diff --quiet -- production/assets && test -n "$(git ls-files --others --exclude-standard production/assets)"; then
            echo "New source-reference outputs created"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production/assets
          if git diff --cached --quiet; then
            echo "Source profile already matches current reference"
            exit 0
          fi
          git commit -m "art(reference): preserve artist-source profile and silhouette validation"
          git push origin HEAD:refs/heads/rebuild/arcturian-awakening-20261113
