name: Arcturian game quality gate

on:
  push:
    branches:
      - arcturian-inhabited-world-slice-20261113
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game-walk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The isolated game-walk package currently has no lockfile. Generate
      # one as a separately reviewed task; do not pretend npm ci is available.
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Typecheck
        run: npm run check
      - name: Narrative tests
        run: npm test
      - name: Build and budget gate
        run: npm run build
